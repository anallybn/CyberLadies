debug=false
logging.level.root=INFO
logging.level.org.springframework=INFO
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Sem fallback local: preencher exclusivamente no painel da hospedagem.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
# Somente o frontend publicado; não libera previews nem curingas.
APP_CORS_ORIGINS=https://cyber-ladies.vercel.app
# Orçamento inicial para instância de 512 MB; medir RSS no primeiro deploy.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=4
